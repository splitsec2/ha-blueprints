    # === LIGHT FLASHING CONFIGURATION ===
    enable_light_flash:
      name: 💡 Enable Light Flashing
      description: Flash a light during Stage 2 and Stage 3 alerts
      default: false
      selector:
        boolean:

    flash_light:
      name: 💡 Flash Light
      description: Light or light group to flash (only used if light flashing enabled)
      default: {}
      selector:
        entity:
          filter:
            - domain: light

    flash_start_stage:
      name: 🚀 Flash Start Stage
      description: Which stage should light flashing begin?
      default: stage2
      selector:
        select:
          options:
            - label: "Stage 1 (Immediate)"
              value: stage1
            - label: "Stage 2 (Recommended)"
              value: stage2
            - label: "Stage 3 (Critical Only)"
              value: stage3
            - label: "Stage 3 Continuous (Critical + Repeating)"
              value: stage3_continuous

    flash_count:
      name: 🔢 Number of Flashes
      description: How many times should the light flash per sequence
      default: 3
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider

    flash_duration:
      name: ⏱️ Flash Sequence Duration
      description: Total time for complete flash sequence (minimum 1 second)
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 0.5
          unit_of_measurement: seconds
          mode: slider

    flash_dim_level:
      name: 🔅 Flash Dim Level
      description: Brightness level for dim phase of flash (0-100%)
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

    flash_bright_level:
      name: 🔆 Flash Bright Level
      description: Brightness level for bright phase of flash (must be 30% higher than dim level)
      default: 90
      selector:
        number:
          min: 30
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

    flash_color:
      name: 🎨 Flash Color
      description: Color to use for flashing (RGB lights only)
      default: [255, 0, 0]
      selector:
        color_rgb:

variables:
  # Input variables
  door_sensor_entity: !input door_sensor
  door_name_var: !input door_name
  local_speaker_entity: !input local_speaker
  all_speakers_entity: !input all_speakers

  # Simplified timing - just use the inputs directly
  first_delay: !input first_alert_delay
  second_delay: !input second_alert_delay
  critical_delay: !input critical_alert_delay
  repeat_interval: !input critical_repeat_interval

  # Message variables - with dynamic minute calculation
  stage1_message: "{{ door_name_var }} is open"
  stage2_message: "{{ door_name_var }} is still open"

  # Other variables
  local_volume: !input local_alert_volume
  critical_volume: !input critical_alert_volume
  tts_platform_var: !input tts_platform
  stage1_chime_var: !input stage1_chime
  stage2_chime_var: !input stage2_chime
  stage3_chime_var: !input stage3_chime
  enable_light_flash_var: !input enable_light_flash
  flash_light_entity: !input flash_light
  flash_start_stage_var: !input flash_start_stage
  flash_count_var: !input flash_count
  flash_duration_var: !input flash_duration
  flash_dim_var: !input flash_dim_level
  flash_bright_var: !input flash_bright_level
  flash_color_var: !input flash_color

trigger:
  - platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      seconds: !input first_alert_delay
    id: "first_alert"

  - platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      seconds: !input second_alert_delay
    id: "second_alert"

  - platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      seconds: !input critical_alert_delay
    id: "critical_alert"

condition:
  - condition: state
    entity_id: !input door_sensor
    state: "on"

action:
  - choose:
      # === STAGE 1: FIRST ALERT ===
      - conditions:
          - condition: trigger
            id: "first_alert"
        sequence:
          - choose:
              # Light flashing enabled for stage 1
              - conditions:
                  - condition: template
                    value_template: "{{ enable_light_flash_var }}"
                  - condition: template
                    value_template: "{{ flash_start_stage_var == 'stage1' }}"
                sequence:
                  # Store original light state
                  - variables:
                      original_brightness: "{{ state_attr(flash_light_entity, 'brightness') | default(255) }}"
                      original_rgb_color: "{{ state_attr(flash_light_entity, 'rgb_color') }}"
                      original_color_temp: "{{ state_attr(flash_light_entity, 'color_temp') }}"
                      original_light_state: "{{ states(flash_light_entity) }}"

                  - action: script.announce_with_fallback
                    data:
                      message: "{{ stage1_message }}"
                      speakers: "{{ local_speaker_entity }}"
                      tts_platform: "{{ tts_platform_var }}"
                      cache: true
                      volume_level: "{{ local_volume }}"
                      chime_path: "{{ stage1_chime_var if stage1_chime_var != 'none' else '' }}"

                  - repeat:
                      count: "{{ flash_count_var }}"
                      sequence:
                        - service: light.turn_on
                          target:
                            entity_id: "{{ flash_light_entity }}"
                          data:
                            brightness_pct: "{{ flash_dim_var }}"
                            rgb_color: "{{ flash_color_var }}"
                        - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"
                        - service: light.turn_on
                          target:
                            entity_id: "{{ flash_light_entity }}"
                          data:
                            brightness_pct: "{{ flash_bright_var }}"
                            rgb_color: "{{ flash_color_var }}"
                        - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"

                  # Restore original light state
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'off' }}"
                        sequence:
                          - service: light.turn_off
                            target:
                              entity_id: "{{ flash_light_entity }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'on' }}"
                        sequence:
                          - service: light.turn_on
                            target:
                              entity_id: "{{ flash_light_entity }}"
                            data:
                              brightness: "{{ original_brightness }}"
                              rgb_color: "{{ original_rgb_color if original_rgb_color else omit }}"
                              color_temp: "{{ original_color_temp if original_color_temp else omit }}"
            default:
              # No flashing - just announcement
              - action: script.announce_with_fallback
                data:
                  message: "{{ stage1_message }}"
                  speakers: "{{ local_speaker_entity }}"
                  tts_platform: "{{ tts_platform_var }}"
                  cache: true
                  volume_level: "{{ local_volume }}"
                  chime_path: "{{ stage1_chime_var if stage1_chime_var != 'none' else '' }}"

      # === STAGE 2: SECOND ALERT ===
      - conditions:
          - condition: trigger
            id: "second_alert"
        sequence:
          - choose:
              # Light flashing enabled for stage 2 (or continuing from stage 1)
              - conditions:
                  - condition: template
                    value_template: "{{ enable_light_flash_var }}"
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: "{{ flash_start_stage_var == 'stage1' }}"
                      - condition: template
                        value_template: "{{ flash_start_stage_var == 'stage2' }}"
                sequence:
                  # Store original light state
                  - variables:
                      original_brightness: "{{ state_attr(flash_light_entity, 'brightness') | default(255) }}"
                      original_rgb_color: "{{ state_attr(flash_light_entity, 'rgb_color') }}"
                      original_color_temp: "{{ state_attr(flash_light_entity, 'color_temp') }}"
                      original_light_state: "{{ states(flash_light_entity) }}"

                  - action: script.announce_with_fallback
                    data:
                      message: "{{ stage2_message }}"
                      speakers: "{{ local_speaker_entity }}"
                      tts_platform: "{{ tts_platform_var }}"
                      cache: true
                      volume_level: "{{ local_volume }}"
                      chime_path: "{{ stage2_chime_var if stage2_chime_var != 'none' else '' }}"

                  - repeat:
                      count: "{{ flash_count_var }}"
                      sequence:
                        - service: light.turn_on
                          target:
                            entity_id: "{{ flash_light_entity }}"
                          data:
                            brightness_pct: "{{ flash_dim_var }}"
                            rgb_color: "{{ flash_color_var }}"
                        - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"
                        - service: light.turn_on
                          target:
                            entity_id: "{{ flash_light_entity }}"
                          data:
                            brightness_pct: "{{ flash_bright_var }}"
                            rgb_color: "{{ flash_color_var }}"
                        - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"

                  # Restore original light state
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'off' }}"
                        sequence:
                          - service: light.turn_off
                            target:
                              entity_id: "{{ flash_light_entity }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'on' }}"
                        sequence:
                          - service: light.turn_on
                            target:
                              entity_id: "{{ flash_light_entity }}"
                            data:
                              brightness: "{{ original_brightness }}"
                              rgb_color: "{{ original_rgb_color if original_rgb_color else omit }}"
                              color_temp: "{{ original_color_temp if original_color_temp else omit }}"
            default:
              # No flashing - just announcement
              - action: script.announce_with_fallback
                data:
                  message: "{{ stage2_message }}"
                  speakers: "{{ local_speaker_entity }}"
                  tts_platform: "{{ tts_platform_var }}"
                  cache: true
                  volume_level: "{{ local_volume }}"
                  chime_path: "{{ stage2_chime_var if stage2_chime_var != 'none' else '' }}"

      # === STAGE 3: CRITICAL REPEATING ALERT ===
      - conditions:
          - condition: trigger
            id: "critical_alert"
        sequence:
          # Store original light state for Stage 3
          - variables:
              original_brightness: "{{ state_attr(flash_light_entity, 'brightness') | default(255) }}"
              original_rgb_color: "{{ state_attr(flash_light_entity, 'rgb_color') }}"
              original_color_temp: "{{ state_attr(flash_light_entity, 'color_temp') }}"
              original_light_state: "{{ states(flash_light_entity) }}"

          - repeat:
              while:
                - condition: state
                  entity_id: !input door_sensor
                  state: "on"
              sequence:
                - choose:
                    # Light flashing enabled for stage 3 - should flash if start stage is 1, 2, or 3 (but NOT continuous)
                    - conditions:
                        - condition: template
                          value_template: "{{ enable_light_flash_var }}"
                        - condition: template
                          value_template: "{{ flash_start_stage_var in ['stage1', 'stage2', 'stage3'] }}"
                      sequence:
                        - variables:
                            message: >
                              {% set minutes = ((now() - states[door_sensor_entity].last_changed).total_seconds() / 60) | round(0) | int %}
                              CRITICAL: {{ door_name_var }} has been open for {{ minutes }} {{ 'minute' if minutes == 1 else 'minutes' }}
                        - action: script.announce_with_fallback
                          data:
                            message: "{{ message }}"
                            speakers: "{{ all_speakers_entity }}"
                            tts_platform: "{{ tts_platform_var }}"
                            cache: true
                            volume_level: "{{ critical_volume }}"
                            chime_path: "{{ stage3_chime_var if stage3_chime_var != 'none' else '' }}"
                        - repeat:
                            count: "{{ flash_count_var }}"
                            sequence:
                              - service: light.turn_on
                                target:
                                  entity_id: "{{ flash_light_entity }}"
                                data:
                                  brightness_pct: "{{ flash_dim_var }}"
                                  rgb_color: "{{ flash_color_var }}"
                              - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"
                              - service: light.turn_on
                                target:
                                  entity_id: "{{ flash_light_entity }}"
                                data:
                                  brightness_pct: "{{ flash_bright_var }}"
                                  rgb_color: "{{ flash_color_var }}"
                              - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"
                        # Restore light state after each flash sequence (for non-continuous)
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ original_light_state == 'off' }}"
                              sequence:
                                - service: light.turn_off
                                  target:
                                    entity_id: "{{ flash_light_entity }}"
                            - conditions:
                                - condition: template
                                  value_template: "{{ original_light_state == 'on' }}"
                              sequence:
                                - service: light.turn_on
                                  target:
                                    entity_id: "{{ flash_light_entity }}"
                                  data:
                                    brightness: "{{ original_brightness }}"
                                    rgb_color: "{{ original_rgb_color if original_rgb_color else omit }}"
                                    color_temp: "{{ original_color_temp if original_color_temp else omit }}"
                    # Stage 3 CONTINUOUS: Constant flashing with occasional announcements
                    - conditions:
                        - condition: template
                          value_template: "{{ enable_light_flash_var }}"
                        - condition: template
                          value_template: "{{ flash_start_stage_var == 'stage3_continuous' }}"
                      sequence:
                        # Make announcement first
                        - variables:
                            message: >
                              {% set minutes = ((now() - states[door_sensor_entity].last_changed).total_seconds() / 60) | round(0) | int %}
                              CRITICAL: {{ door_name_var }} has been open for {{ minutes }} {{ 'minute' if minutes == 1 else 'minutes' }}
                        - action: script.announce_with_fallback
                          data:
                            message: "{{ message }}"
                            speakers: "{{ all_speakers_entity }}"
                            tts_platform: "{{ tts_platform_var }}"
                            cache: true
                            volume_level: "{{ critical_volume }}"
                            chime_path: "{{ stage3_chime_var if stage3_chime_var != 'none' else '' }}"
                        # Then flash continuously until next announcement - simplified approach
                        - repeat:
                            count: "{{ (repeat_interval / (flash_duration_var + 1)) | round(0, 'floor') | int }}"
                            sequence:
                              # Flash sequence
                              - repeat:
                                  count: "{{ flash_count_var }}"
                                  sequence:
                                    - service: light.turn_on
                                      target:
                                        entity_id: "{{ flash_light_entity }}"
                                      data:
                                        brightness_pct: "{{ flash_dim_var }}"
                                        rgb_color: "{{ flash_color_var }}"
                                    - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"
                                    - service: light.turn_on
                                      target:
                                        entity_id: "{{ flash_light_entity }}"
                                      data:
                                        brightness_pct: "{{ flash_bright_var }}"
                                        rgb_color: "{{ flash_color_var }}"
                                    - delay: "{{ (flash_duration_var / (flash_count_var * 2)) | round(1) }}"

                              # Return to original state during pause
                              - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: "{{ original_light_state == 'off' }}"
                                    sequence:
                                      - service: light.turn_off
                                        target:
                                          entity_id: "{{ flash_light_entity }}"
                                default:
                                  - service: light.turn_on
                                    target:
                                      entity_id: "{{ flash_light_entity }}"
                                    data:
                                      brightness: "{{ original_brightness }}"
                                      rgb_color: "{{ original_rgb_color if original_rgb_color else omit }}"
                                      color_temp: "{{ original_color_temp if original_color_temp else omit }}"

                              # Pause (except on last iteration)
                              - condition: template
                                value_template: "{{ repeat.index < repeat.max }}"
                              - delay: 1
                  default:
                    # No flashing - just announcement
                    - variables:
                        message: >
                          {% set minutes = ((now() - states[door_sensor_entity].last_changed).total_seconds() / 60) | round(0) | int %}
                          CRITICAL: {{ door_name_var }} has been open for {{ minutes }} {{ 'minute' if minutes == 1 else 'minutes' }}
                    - action: script.announce_with_fallback
                      data:
                        message: "{{ message }}"
                        speakers: "{{ all_speakers_entity }}"
                        tts_platform: "{{ tts_platform_var }}"
                        cache: true
                        volume_level: "{{ critical_volume }}"
                        chime_path: "{{ stage3_chime_var if stage3_chime_var != 'none' else '' }}"

                - condition: state
                  entity_id: !input door_sensor
                  state: "on"

                - delay: "{{ repeat_interval }}"

          # Restore original light state when Stage 3 ends (only if NOT continuous)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_light_flash_var }}"
                  - condition: template
                    value_template: "{{ flash_start_stage_var != 'stage3_continuous' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'off' }}"
                        sequence:
                          - service: light.turn_off
                            target:
                              entity_id: "{{ flash_light_entity }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'on' }}"
                        sequence:
                          - service: light.turn_on
                            target:
                              entity_id: "{{ flash_light_entity }}"
                            data:
                              brightness: "{{ original_brightness }}"
                              rgb_color: "{{ original_rgb_color if original_rgb_color else omit }}"
                              color_temp: "{{ original_color_temp if original_color_temp else omit }}"

          # Restore original light state for continuous flashing (always restore at end)
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_light_flash_var }}"
                  - condition: template
                    value_template: "{{ flash_start_stage_var == 'stage3_continuous' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'off' }}"
                        sequence:
                          - service: light.turn_off
                            target:
                              entity_id: "{{ flash_light_entity }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ original_light_state == 'on' }}"
                        sequence:
                          - service: light.turn_on
                            target:
                              entity_id: "{{ flash_light_entity }}"
                            data:
                              brightness: "{{ original_brightness }}"
                              rgb_color: "{{ original_rgb_color if original_rgb_color else omit }}"
                              color_temp: "{{ original_color_temp if original_color_temp else omit }}"

mode: restart
max_exceeded: silent
