blueprint:
  name: 🚪 Advanced Tiered Door Alert System
  description: >-
    # 🚪 ADVANCED TIERED DOOR ALERT SYSTEM

    **Version:** 1.3.012

    **Category:** Alert & Monitoring

    ---

    ## 📖 DESCRIPTION

    A comprehensive three-stage escalating alert system for monitoring doors that shouldn't be left open. Perfect for refrigerators, freezers, exterior doors, garage doors, and any other critical entry points.

    **Key Features:**

    - 🔊 **Three-tier escalating alerts** with customizable timing

    - 🎵 **Chime TTS integration** with configurable chimes per stage

    - 💡 **Smart light flashing** with RGB color support and brightness control

    - 📱 **Mobile notifications** with configurable start stage

    - 🛡️ **Override sensor** support for conditional monitoring

    - 📋 **Preset configurations** for common door types

    - 🔧 **Comprehensive customization** options

    ---

    ## 🎯 ALERT STAGES

    **Stage 1: First Local Alert**
    - **Trigger:** After initial timeout
    - **Actions:** Local speaker announcement (no chime by default)
    - **Mobile:** Optional (if configured)

    **Stage 2: Second Local Alert**  
    - **Trigger:** After second timeout
    - **Actions:** Local speaker with chime + light flashing begins
    - **Mobile:** Optional (if configured)

    **Stage 3: Critical House-wide Alert**
    - **Trigger:** After critical timeout
    - **Actions:** All speakers with chime + continued light flashing + repeating announcements
    - **Mobile:** Always included (with timing information)

    ---

    ## 💡 PRO TIPS

    - **Test your timing:** Start with shorter delays while testing, then increase
    - **Speaker groups:** Create a "house_wide" media player group for critical alerts
    - **Light selection:** Use a prominent light that's easily noticed
    - **Override sensor:** Great for sliding doors with screens, or maintenance modes
    - **Mobile notifications:** Consider starting at Stage 2 to avoid notification spam

    ---

    ## 🔗 DEPENDENCIES

    - **Chime TTS** - For enhanced audio announcements
    - **Mobile App** - For push notifications (optional)
    - **RGB Light** - For color flashing (optional, works with any light)

    ---

    ## 📞 SUPPORT & FEEDBACK

    This blueprint is designed to be comprehensive yet easy to use. All timing, messages, and behaviors are fully customizable while providing sensible defaults for common scenarios.

    **Found this helpful?** Please consider sharing your configuration and feedback!

  domain: automation
  source_url: https://raw.githubusercontent.com/splitsec2/ha-blueprints/main/blueprints/automation/tiered_door_alert.yaml
  homeassistant:
    min_version: 2024.1.0

  input:
    # === BASIC CONFIGURATION ===
    door_sensor:
      name: 🚪 Door Sensor
      description: Binary sensor that detects when door is open (reports 'on' when open)
      selector:
        entity:
          filter:
            - domain: binary_sensor

    door_name:
      name: 🏷️ Door Name
      description: Human-readable name for the door (used in announcements)
      default: "Door"
      selector:
        text:

    # === AUDIO CONFIGURATION ===
    local_speaker:
      name: 🔊 Local Speaker
      description: >-
        Media player(s) for Stage 1 and Stage 2 alerts (near the door).
        Priority-ordered — if the first doesn't confirm playback within
        5s, the next is tried.
      selector:
        entity:
          domain: media_player
          multiple: true

    all_speakers:
      name: 📢 House-wide Speakers
      description: >-
        Media player(s) for Stage 3 critical alerts. Priority-ordered —
        tried one at a time until one confirms playback, not simultaneous.
      selector:
        entity:
          domain: media_player
          multiple: true

    # === TIMING CONFIGURATION ===
    first_alert_delay:
      name: ⏱️ First Alert Delay
      description: Time before first local alert (minimum 10 seconds)
      default: 90
      selector:
        number:
          min: 5
          max: 1800
          step: 5
          unit_of_measurement: seconds
          mode: slider

    second_alert_delay:
      name: ⏱️ Second Alert Delay
      description: Total time before second local alert (must be > first alert + 30s)
      default: 180
      selector:
        number:
          min: 10
          max: 2400
          step: 5
          unit_of_measurement: seconds
          mode: slider

    critical_alert_delay:
      name: ⚠️ Critical Alert Delay
      description: Total time before critical house-wide alerts (must be > second alert + 60s)
      default: 300
      selector:
        number:
          min: 15
          max: 3600
          step: 5
          unit_of_measurement: seconds
          mode: slider

    critical_repeat_interval:
      name: 🔄 Critical Repeat Interval
      description: How often to repeat critical alerts (minimum 15 seconds)
      default: 45
      selector:
        number:
          min: 15
          max: 600
          step: 5
          unit_of_measurement: seconds
          mode: slider

    # === VOLUME CONFIGURATION ===
    local_alert_volume:
      name: 🔉 Local Alert Volume
      description: Volume for Stage 1 and Stage 2 alerts (0.0 to 1.0)
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.1
          mode: slider

    critical_alert_volume:
      name: 🔊 Critical Alert Volume
      description: Volume for Stage 3 house-wide alerts (0.0 to 1.0)
      default: 0.8
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.1
          mode: slider

    # === CHIME CONFIGURATION ===
    tts_platform:
      name: 🗣️ TTS Platform
      description: Text-to-speech platform to use with Chime TTS
      default: google_translate
      selector:
        select:
          options:
            - label: "Amazon Polly"
              value: amazon_polly
            - label: "Baidu"
              value: baidu
            - label: "ElevenLabs TTS"
              value: tts.elevenlabs_text_to_speech
            - label: "Google Cloud"
              value: google_cloud
            - label: "Google Translate"
              value: google_translate
            - label: "IBM Watson TTS"
              value: watson_tts
            - label: "MaryTTS"
              value: marytts
            - label: "Microsoft Edge TTS"
              value: edge_tts
            - label: "Microsoft Text-To-Speech"
              value: microsoft
            - label: "Nabu Casa Cloud TTS"
              value: cloud
            - label: "OpenAI TTS"
              value: openai_tts
            - label: "Pico TTS"
              value: picotts
            - label: "Piper"
              value: tts.piper
            - label: "VoiceRSS"
              value: voicerss
            - label: "Yandex TTS"
              value: yandextts

    stage1_chime:
      name: 🎵 Stage 1 Chime
      description: Chime sound for first alert (none recommended)
      default: none
      selector:
        select:
          options:
            - label: "🔇 No Chime"
              value: none
            - label: "🔔 Bells"
