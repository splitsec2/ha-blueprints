            - label: "🥁 Drumroll"
              value: drumroll
            - label: "🎵 Dun Dun Dun"
              value: dun_dun_dun
            - label: "❌ Error"
              value: error
            - label: "🎺 Fanfare"
              value: fanfare
            - label: "🎵 Glockenspiel"
