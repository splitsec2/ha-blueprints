    stage2_chime:
      name: 🎵 Stage 2 Chime
      description: Chime sound for second alert
      default: whistle
      selector:
        select:
          options:
            - label: "🔇 No Chime"
              value: none
            - label: "🔔 Bells"
              value: bells
            - label: "🔔 Bells 2"
              value: bells_2
            - label: "🎵 Ba Dum Tss"
