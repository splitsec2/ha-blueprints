    stage3_chime:
      name: 🎵 Stage 3 Chime
      description: Chime sound for critical alerts
      default: error
      selector:
        select:
          options:
            - label: "🔇 No Chime"
              value: none
            - label: "🔔 Bells"
              value: bells
            - label: "🔔 Bells 2"
              value: bells_2
            - label: "🎵 Ba Dum Tss"
              value: ba_dum_tss
